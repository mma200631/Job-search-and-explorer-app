<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Explore Careers | Job Explorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/main.mjs"></script>
</head>
<body>

<header>
    <div class="logo">
        🔎💼 Job Explorer
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="careers.html">Careers</a>
    </nav>
</header>

<main>

    <section class="page-header">
        <h1>Explore Careers</h1>
        <p>Search for careers and learn about required skills, tasks, salary, and outlook.</p>
    </section>

    <section class="search-section">
        <form id="career-search-form">
            <input type="text" id="career-keyword" placeholder="Career name (e.g. Software Developer)" required>
            <button type="submit" class="btn-primary">Explore</button>
        </form>
    </section>

    <section class="results-section">
        <div id="career-container">
            <!-- Career details will appear here -->
        </div>
    </section>

</main>

<footer>
    <p>&copy; 2026 Job Search & Career Explorer</p>
</footer>


</body>
</html>
